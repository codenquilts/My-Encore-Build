[gcode_macro PREHEAT_PLA]
description:CYD_SCREEN_MACRO
#description: Preheat for PLA
gcode:
    M117 Preheating PLA
    M140 S60
    M104 S210

[gcode_macro PREHEAT_PETG]
description: Preheat for PETG
gcode:
    M117 Preheating PETG
    M140 S80
    M104 S245

[gcode_macro PREHEAT_TPU]
description: Preheat for TPU
gcode:
    M117 Preheating TPU
    M140 S45
    M104 S225

[gcode_macro COOL_DOWN]
description: Turn heaters off
gcode:
    M117 Cooling Down
    TURN_OFF_HEATERS
    
