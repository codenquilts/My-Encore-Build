# DOCUMENTATION EXCERPT ONLY — NOT A COMPLETE DROP-IN CONFIGURATION
# Verify all pins, directions, dimensions, thermistors and endstops against the
# actual Encore Mini before using this file.

[printer]
kinematics: corexy
max_velocity: 300
max_accel: 3500
max_z_velocity: 5
max_z_accel: 100

[tmc2209 stepper_x]
# Keep the installed SKR Mini E3 V3.0 UART pin and driver settings here.
run_current: 0.700

[tmc2209 stepper_y]
# Keep the installed SKR Mini E3 V3.0 UART pin and driver settings here.
run_current: 0.700

[tmc2209 extruder]
uart_pin: PC11
tx_pin: PC10
uart_address: 3
run_current: 0.650

